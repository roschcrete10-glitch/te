name: Testing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest  
    permissions:
      contents: read
    steps:
    - name: Get Repo code
      uses: actions/checkout@v3

    - name: Check file
      run: test -f test.py

    - name: Check other file
      run: test -f t.py
    
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:

    - name: Print Success Message
      run: |
        echo "Success"
        echo "Success"

       


