name: Python Test, Build, and Deploy

on:
  push:
    branches: [ "main" ]  # Triggers the pipeline automatically when you push to the main branch

jobs:
  pipeline:
    runs-on: ubuntu-latest  # Runs on a clean Linux virtual machine hosted by GitHub

    steps:
    # 1. Download your code from GitHub onto the runner machine
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Set up the Python Environment on the runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Run your verification test script locally on the runner
    - name: Verify and Test Code
      run: python test.py

    # 4. Securely log in to Docker Hub using your encrypted Repository Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Compile your Docker Blueprint using your dynamic Docker Hub username
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-python-app:latest .

    # 6. Ship the final frozen image to your cloud Docker Hub account library
    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/my-python-app:latest
